[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant"
version = "0.1.0"
description = "Backtesting, walk-forward testing and paper trading for index and US equity strategies"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
live = ["alpaca-py>=0.30"]
nqbot = ["schwab-py>=1.5"]
minute = ["alpaca-py>=0.30", "databento>=0.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
